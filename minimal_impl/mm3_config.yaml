wandb:
  enabled: true
  project: epsilon-mm3
  entity: dmitry2-uiuc
  run_name: mm3_transformer_run
  mode: online

training:
  num_epochs: 200
  learning_rate: 0.001
  batch_size: 64
  batches_per_epoch: 10
  weighted_loss: false
  normalize_by_lower_bound: false  # Set to true to normalize losses by theoretical lower bound (like scripts/train.py)
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8

model:
  n_layers: 2
  d_model: 128
  n_heads: 2
  d_mlp: 512
  seed: 0

mm3:
  n_ctx: 7
  bos: false
  x: 0.05
  a: 0.85

device: auto

checkpoints:
  enabled: true  # Set to false to disable checkpoint saving
  dir: ./checkpoints  # Directory where checkpoints will be saved

belief_regression:
  enabled: true
  intervals: 2
  use_gpu: true
